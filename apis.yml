aid: glue
name: Glue
description: >-
  Glue is a team communication platform that replaces channel-based chat with structured,
  named threads so decisions stay organized and don't get lost, with AI agents (@Glue, @Cursor)
  that can be mentioned inside threads to summarize, add context, and generate work. For
  developers, Glue exposes a public GraphQL API at api.gluegroups.com for sending messages and
  reading workspaces, threads, and groups; OAuth 2.0 authentication (client-credentials for the
  GraphQL API, plus an authorization-code flow with dynamic client registration and PKCE for a
  hosted remote MCP server at mcp.glue.ai); outbound webhooks (message.created, thread.created)
  signed with HMAC-SHA256; and idempotent upsert keys on message and thread creation. Glue is
  SOC 2 compliant, supports SSO (Google, Okta), and is backed by Craft Ventures and Y Combinator.
